apiVersion: apps/v1
kind: Deployment
metadata:
  name: freescout
  namespace: freescout
spec:
  strategy:
    type: Recreate
  template:
    spec:
      initContainers: null
      containers:
        - name: freescout
          ports: null
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: freescout-mariadb
  namespace: freescout
spec:
  template:
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          securityContext:
            capabilities:
              drop: [ALL]
          resources:
            limits:
              memory: 1Gi
